apply plugin: 'com.android.application'

def releaseSigningDirectory = rootProject.file('.signing')
def releaseKeystore = new File(releaseSigningDirectory, 'iptv-release.jks')
def releaseSigningInfo = new File(releaseSigningDirectory, 'keystore-info.properties')
def releaseSigningAvailable = releaseKeystore.isFile() && releaseSigningInfo.isFile()
if (releaseKeystore.exists() != releaseSigningInfo.exists()) {
    throw new GradleException('Both .signing/iptv-release.jks and '
            + '.signing/keystore-info.properties are required for release signing.')
}
def releaseSigningProperties = new Properties()
if (releaseSigningAvailable) {
    releaseSigningInfo.withInputStream { releaseSigningProperties.load(it) }
    ['alias', 'storePassword', 'keyPassword'].each { propertyName ->
        if (!releaseSigningProperties.getProperty(propertyName)) {
            throw new GradleException("Missing ${propertyName} in "
                    + '.signing/keystore-info.properties')
        }
    }
}

android {
    compileSdkVersion 27
    buildToolsVersion '27.0.3'

    signingConfigs {
        if (releaseSigningAvailable) {
            iptvRelease {
                storeFile releaseKeystore
                storePassword releaseSigningProperties.getProperty('storePassword')
                keyAlias releaseSigningProperties.getProperty('alias')
                keyPassword releaseSigningProperties.getProperty('keyPassword')
            }
        }
    }

    defaultConfig {
        applicationId 'com.xingshi.tv'
        minSdkVersion 16
        // API 28 avoids Android 9 WebView hidden-API compatibility warnings
        // while keeping the old Gradle/compileSdk toolchain unchanged.
        targetSdkVersion 28
        versionCode 6
        versionName '1.2.0'

        ndk {
            abiFilters 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigningAvailable) {
                signingConfig signingConfigs.iptvRelease
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            jni.srcDirs = []
            jniLibs.srcDirs = ['src/main/libs']
        }
    }
}

dependencies {
    implementation 'tv.danmaku.ijk.media:ijkplayer-java:0.8.8'
    implementation 'tv.danmaku.ijk.media:ijkplayer-armv7a:0.8.8'
}

